<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>WOLFRAM — Model Viewer</title>
<style>
:root { --line: #24384a; --text: #d8e4ee; --dim: #7d90a3; --accent: #4ad0e6; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #05080c; color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
#app { display: grid; grid-template-columns: 270px 1fr; height: 100%; }
#side { border-right: 1px solid var(--line); overflow-y: auto; padding: 12px; background: #080e15; -webkit-overflow-scrolling: touch; }
#side .logo { font-weight: 800; letter-spacing: 0.3em; font-size: 20px; color: #e8f4ff; }
#side .tag { color: var(--accent); font-size: 12px; margin-bottom: 8px; }
#side h3 { font-size: 11px; letter-spacing: 0.16em; color: var(--dim); text-transform: uppercase; margin: 16px 0 6px; }
.item { display: block; width: 100%; text-align: left; background: none; border: 1px solid transparent; border-radius: 6px; padding: 6px 8px; color: var(--text); font: inherit; cursor: pointer; }
.item b { display: block; font-size: 13px; font-weight: 600; } .item span { font-size: 11px; color: var(--dim); }
.item:hover { background: #0f1b28; } .item.sel { background: #12303c; border-color: var(--accent); }
#main { position: relative; }
#vc { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#info { position: absolute; left: 14px; top: 12px; max-width: 360px; background: rgba(6, 12, 18, 0.8); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; font-size: 13px; pointer-events: none; }
#info h2 { margin: 0 0 6px; font-size: 16px; color: var(--accent); letter-spacing: 0.05em; }
#info dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 0; } #info dt { color: var(--dim); } #info dd { margin: 0; }
#info p { margin: 4px 0; line-height: 1.4; } .dim { color: var(--dim); }
#ctls { position: absolute; left: 14px; bottom: 14px; right: 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.grp { display: flex; gap: 4px; background: rgba(6, 12, 18, 0.8); border: 1px solid var(--line); border-radius: 8px; padding: 4px; align-items: center; }
.grp label { font-size: 11px; color: var(--dim); padding: 0 6px; letter-spacing: 0.08em; }
.btn { font: inherit; font-size: 12px; color: var(--text); background: #142130; border: 1px solid #2c445c; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
.btn.sel { background: #1d4a5a; border-color: var(--accent); color: #fff; }
#help { position: absolute; right: 14px; top: 12px; font-size: 11px; color: var(--dim); background: rgba(6, 12, 18, 0.7); padding: 5px 9px; border-radius: 6px; }
@media (max-width: 720px) { #app { grid-template-columns: 1fr; grid-template-rows: 38% 62%; } #side { border-right: 0; border-bottom: 1px solid var(--line); order: 2; } #main { order: 1; } #info { max-width: 60%; font-size: 12px; } }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js" } }</script>
</head>
<body>
<div id="app">
  <div id="side"><div class="logo">WOLFRAM</div><div class="tag">Ship model viewer</div><div id="list"></div></div>
  <div id="main">
    <canvas id="vc"></canvas>
    <div id="info"></div>
    <div id="help">Drag to orbit · scroll / pinch to zoom</div>
    <div id="ctls">
      <div class="grp" id="ctl-cond"><label>STATUS</label>
        <button class="btn sel" data-cond="ok">Nominal</button><button class="btn" data-cond="damaged">Damaged</button><button class="btn" data-cond="critical">Critical</button><button class="btn" data-cond="fault">Fault</button><button class="btn" data-cond="dead">Destroyed</button>
      </div>
      <div class="grp"><button class="btn" id="t-fire">On fire</button><button class="btn" id="t-ceil">Ceiling</button><button class="btn" id="t-wire">Wireframe</button><button class="btn" id="t-spin">Auto-rotate</button></div>
    </div>
  </div>
</div>
<script type="module" src="js/viewer.js"></script>
<!--INLINE-JS-->
</body>
</html>
